# LSL Template Configuration
# This file configures the LSL stream parameters

[Stream]
name=LSLTemplate
type=Counter
channels=1
sample_rate=10

[Device]
device_param=0

# emotiv_lsl fallback only (after LabRecorder.cfg): when enabled=1 and you do not pass --record, XDF path is built from filename_template.
# Placeholders: {stream_name}, {basename}, {date}, {time}. directory is under the executable when relative.
[Recording]
enabled=0
directory=recordings
filename_template={stream_name}_{date}_{time}.xdf
basename=
